<div class="modal-dialog">
    <div class="modal-content">
        <form method="post" action="{% url 'fac:factura_emitir_ncd' enc.id %}">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title">Emitir Nota de Crédito-Débito</h5>
                <button type="button" class="close" onclick="return cerrar_modal()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning">
                    <strong>Atención:</strong> esto corrige la factura N° {{ enc.id }}
                    (Bs {{ enc.total }}) ante el SIN, con una <b>devolución total</b>.
                    Una vez validada, la factura queda cerrada fiscalmente — no se
                    podrá anular, eliminar, ni registrarle más abonos.
                </div>
                <div class="form-group">
                    <label>Motivo de la corrección (obligatorio):</label>
                    <textarea class="form-control" name="motivo" rows="3" required
                        placeholder="Ej: cliente devolvió toda la mercadería; la factura ya tenía abonos registrados"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="return cerrar_modal()">Cancelar</button>
                <button type="submit" class="btn btn-warning">Confirmar Emisión</button>
            </div>
        </form>
    </div>
</div>
