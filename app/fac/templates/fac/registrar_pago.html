<div class="modal-dialog">
    <div class="modal-content">
        <form role="form" id="frmRegistrarPago" action="{% url 'fac:registrar_pago' enc.id %}" method="POST">
            <div class="card border-left-primary shadow py-2">
                <div class="card-body">
                    <div class="csg-form-title">Registrar Pago — Factura N° {{ enc.id }}</div>
                    <div class="dropdown-divider"></div>
                    {% csrf_token %}
                    <p>Cliente: <b>{{ enc.cliente }}</b><br>
                       Saldo pendiente: <b>Bs {{ enc.saldo_pendiente }}</b></p>
                    <div class="form-group">
                        <label>Monto a abonar (Bs)</label>
                        <input type="number" step="0.01" name="monto" class="form-control" max="{{ enc.saldo_pendiente }}" required>
                    </div>
                    <div class="form-group">
                        <label>Forma de Pago del abono</label>
                        <select name="forma_pago" class="form-control">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="QR">QR</option>
                            <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Observación (opcional)</label>
                        <textarea name="observacion" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="dropdown-divider"></div>
                    <button type="submit" class="btn btn-primary">Registrar Pago</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="return cerrar_modal()">Cancelar</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // abrir_modal() (base.html) engancha su propio submit AJAX a
    // CUALQUIER form cargado en el popup -- por eso el pago se
    // registraba bien (el POST igual llegaba a registrar_pago) pero
    // nunca se veia la pantalla de pago_confirmacion: una redirect()
    // de Django dentro de una respuesta AJAX no hace que el navegador
    // cambie de pagina, jQuery solo trae el HTML final por dentro sin
    // mostrarlo. stopImmediatePropagation() bloquea ese handler
    // generico solo para este form, dejando que el navegador haga el
    // POST nativo de pagina completa -- asi el redirect() de Django
    // a pago_confirmacion funciona como corresponde.
    $('#frmRegistrarPago').on('submit', function(e){
        e.stopImmediatePropagation();
    });
</script>
