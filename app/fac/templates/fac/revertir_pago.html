{% load l10n %}
<div class="form-group">
    <label>Abono a revertir:</label>
    <p class="mb-1">
        Factura N° {{ pago.factura_id }} — <b>Bs {{ pago.monto }}</b> ({{ pago.get_forma_pago_display }})<br>
        <small class="text-muted">Registrado el {{ pago.fecha|date:'d/m/Y H:i' }}</small>
    </p>
</div>
<div class="form-group">
    <label>Motivo de la reversión (obligatorio):</label>
    <textarea class="form-control" id="motivo" name="motivo" rows="2"
        placeholder="Ej: se cargó el monto equivocado"></textarea>
</div>
<div class="form-group">
    <label>Usuario (Supervisor):</label>
    <input type="text" class="form-control" id="usuario" name="usuario">
</div>
<div class="form-group">
    <label>Contraseña:</label>
    <input type="password" class="form-control" id="password" name="pass">
</div>
